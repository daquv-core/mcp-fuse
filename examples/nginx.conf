# mcp-fuse behind nginx. nginx ends TLS and sends one path to mcp-fuse; everything else is mcp-fuse's.
# See docs/deployment.md.

server {
    listen 443 ssl;
    server_name mcp.example.com;
    # ssl_certificate / ssl_certificate_key ...

    # The MCP endpoint and the pages where a person connects a backend (/mcp/connect/...).
    location /mcp {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_buffering off;          # a tool's reply may be an event stream
        proxy_read_timeout 600s;      # a tool call may run for minutes
        client_max_body_size 16m;     # mcp-fuse refuses larger requests itself

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authorization, MCP-Protocol-Version and the connect cookie reach mcp-fuse unchanged by default.
    }

    # Where agents find out which authorization server to log in at (RFC 9728).
    location /.well-known/oauth-protected-resource {
        proxy_pass http://127.0.0.1:8080;
    }
}
